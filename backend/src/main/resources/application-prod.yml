# Production profile: NO defaults for connection secrets.
# DB_URL, DB_USERNAME, DB_PASSWORD and JWT_SECRET MUST be set — startup fails
# fast otherwise (the base profile's placeholder secret must never reach prod).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    com.labmarket: INFO
    org.hibernate.SQL: WARN
