# Unprivileged nginx (listens on 8080) with SPA history fallback so
# deep links like /equipment/3 work on refresh. API calls pass through to the
# backend in the browser; see CORS_ALLOWED_ORIGINS on the backend.
server {
    listen       8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache aggressively; index.html never (it references hashes).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
